<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="description" content="国际货运单号查询，实时追踪包裹轨迹。">
<meta name="keywords" content="国际货运单号查询，实时追踪包裹轨迹。">
<title>国际货运 - 在线查件系统</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft Yahei","PingFang SC",sans-serif;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{min-height:100vh;padding:15px 12px;background:#f7f7f7;}
.container{max-width:600px;margin:0 auto;}
.header-card,.card-wrap,.service-card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 10px rgba(0,0,0,.08);margin-bottom:8px;}
.page-header{text-align:center;margin-bottom:8px;}
.page-header h1{color:#222;font-size:24px;margin-bottom:4px;}
.page-header .tip-text{font-size:28px;color:#d03030;font-weight:800;letter-spacing:2px;}
.top-nav{margin-bottom:8px;}
.nav-bar{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 20px;}
@media(min-width:601px){.nav-bar{gap:10px;padding:0 4px;}}
.nav-item{display:flex;align-items:center;justify-content:center;gap:4px;height:34px;background:#fff;border-radius:999px;color:#0065b8;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #eaf4ff;box-shadow:0 2px 8px rgba(0,116,204,.12),0 1px 2px rgba(0,116,204,.08);transition:.15s ease;}
.nav-item:active{transform:scale(.97);box-shadow:0 1px 4px rgba(0,116,204,.1);}
.nav-item svg{width:14px;height:14px;flex-shrink:0;}
.input-pill{width:100%;height:48px;border-radius:8px;border:1px solid #0074cc;padding:0 8px 0 40px;font-size:20px;outline:none;transition:.2s;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%230074cc' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>") no-repeat left 14px center;background-size:18px;}
.input-pill::placeholder{font-size:16px;color:#999;}
.input-pill:focus{border-color:#005ba1;box-shadow:0 0 0 3px rgba(0,116,204,.18);}
.toast-layer{position:fixed;top:40%;left:0;right:0;transform:translateY(-50%);z-index:999;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px;}
.toast-item{padding:10px 18px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;font-size:15px;opacity:0;transform:translateY(20px);transition:.25s;}
.toast-item.show{opacity:1;transform:translateY(0);}
.btn-row{display:flex;gap:14px;margin-top:16px;}
.btn-row button{padding:14px 0;font-size:18px;border:none;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;cursor:pointer;transition:transform .14s ease,opacity .2s;box-shadow:0 2px 6px rgba(0,0,0,.12);}
.btn-row button:active{transform:scale(.96);opacity:.9;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.btn-reset{background:#ff4444;flex:0 0 90px;}
.btn-query{background:#0074cc;flex:1;}
.result-box{margin-top:18px;border:1px solid #ddd;background:#fff;padding:14px;min-height:120px;display:none;border-radius:6px;font-size:15px;}
.result-box h3{margin-bottom:12px;color:#0074cc;}
.loading-tip{text-align:center;padding:40px 0;color:#0074cc;font-size:16px;}
.ship-card{padding:0;margin-bottom:16px;background:transparent;}
.ship-head{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px 0;padding-top:12px;border-top:1px solid #e5e7eb;align-items:center;}
.status-tag{padding:4px 10px;border-radius:4px;color:#fff;font-weight:bold;}
.tag-delivered{background:#00b42a;}
.tag-transit{background:#ff7d00;}
.tip-faint{font-size:14px;color:#999;font-weight:normal;margin-left:6px;}
.info-row{display:flex;align-items:center;margin:6px 0;gap:8px;}
.info-label{color:#666;flex-shrink:0;width:64px;white-space:nowrap;}
.text-blue{color:#0074cc;font-weight:bold;white-space:nowrap;text-decoration:underline;transition:.2s;}
.info-row .text-blue-static{color:#000;font-weight:normal;white-space:nowrap;cursor:default;text-decoration:none;}
.text-blue{cursor:pointer;}
.text-blue:hover{color:#004a85;}
.toggle-track{margin-top:8px;color:#0074cc;cursor:pointer;user-select:none;display:block;}
.track-full{display:none;}
.track-preview{margin-bottom:0;}
.timeline-item{padding:8px 0 8px 12px;border-left:2px solid #dcdcdc;position:relative;margin-left:4px;}
.track-time{font-size:13px;color:#888;margin-bottom:3px;}
.track-desc{font-size:14px;color:#333;}
.error-msg-box{background:#fff5f5;border:1px solid #ffccc7;border-radius:8px;padding:14px;margin-bottom:12px;}
.error-msg-title{color:#d03030;font-size:16px;font-weight:bold;margin-bottom:6px;}
.error-msg-content{color:#595959;font-size:14px;}
.service-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;text-align:center;width:100%;}
.service-tag{font-size:14px;color:#005ba1;background:linear-gradient(180deg,#eaf4ff,#cfe6ff);border:1px solid #b4d4f5;font-weight:600;box-shadow:0 2px 4px rgba(0,116,204,.12),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .14s ease;background .14s ease,box-shadow .14s ease;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:999px;padding:8px 2px;}
.service-tag:active{transform:scale(.94);background:linear-gradient(180deg,#e1f2ff,#c4e1ff);box-shadow:0 1px 3px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.5);}
.service-text{font-size:15px;color:#000;line-height:1.8;width:100%;margin:0;padding:0;text-wrap:pretty;}
.service-text strong{font-weight:600;color:#222;}
.contact-info{text-align:center;font-size:17px;font-weight:bold;color:#000;line-height:1.9;margin-bottom:10px;}
.qrcode-box{width:180px;height:180px;border:2px dashed #999;margin:14px auto 6px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;overflow:hidden;}
.qrcode-box img{width:98%;height:98%;object-fit:contain;}
.qr-desc{text-align:center;font-size:14px;color:#666;margin-bottom:10px;}
.history-modal-mask,.contact-modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;opacity:0;transition:.24s ease;}
.history-modal-mask{align-items:center;justify-content:center;padding:12px;}
.contact-modal-mask{align-items:flex-end;justify-content:center;}
.history-modal-mask.show,.contact-modal-mask.show{display:flex;opacity:1;}
.history-modal,.contact-modal{width:100%;max-width:520px;background:#fff;border-radius:14px;box-shadow:0 4px 30px rgba(0,0,0,.15);transform:translateY(20px);transition:.24s ease;overflow:hidden;}
.contact-modal{border-radius:14px 14px 0 0;}
@media(min-width:601px){.contact-modal{max-width:600px;}}
.modal-header{padding:16px 18px;border-bottom:1px solid #eee;background:#fbfcfe;}
.modal-top-bar{display:flex;justify-content:space-between;align-items:center;margin:0;}
.modal-title{font-size:20px;color:#222;font-weight:600;}
.modal-close{font-size:28px;color:#999;cursor:pointer;line-height:1;transition:.2s;}
.modal-close:hover{color:#333;}
.history-clear-box{width:100%;background:#ff3333;text-align:center;padding:9px 0;border-radius:8px;margin-top:12px;}
.history-clear{display:inline-block;padding:0 24px;color:#fff;cursor:pointer;font-size:15px;transition:.2s;}
.history-clear:active{opacity:.8;}
.history-item{padding:9px 18px;border-bottom:1px solid #f0f2f7;transition:.2s;cursor:pointer;height:72px;display:flex;flex-direction:column;justify-content:center;}
.history-list-wrap{max-height: calc(72px * 5);overflow-y:auto;padding:0;background:#fff;}
.history-list-wrap::-webkit-scrollbar{width:6px;}
.history-list-wrap::-webkit-scrollbar-track{background:#f5f7fa;border-radius:3px;}
.history-list-wrap::-webkit-scrollbar-thumb{background:#c2c9d6;border-radius:3px;}
.history-list-wrap::-webkit-scrollbar-thumb:hover{background:#a8b2c3;}
.history-item:hover{background:#f7faff;}
.history-time{font-size:13px;color:#808896;margin-bottom:3px;}
.history-no{font-size:19px;color:#0065b8;font-weight:500;transition:.2s;}
.history-no:hover{color:#004a85;}
.history-empty{text-align:center;padding:40px 20px;font-size:15px;color:#888;background:#fff;height:360px;display:flex;align-items:center;justify-content:center;}
.contact-modal-body{padding:18px;max-height:70vh;overflow-y:auto;}
@media(max-width:360px){
body{padding:12px 10px;}
.page-header h1{font-size:22px;}
.page-header .tip-text{font-size:24px;}
.btn-row button{font-size:16px;padding:12px 0;}
.card-wrap,.service-card,.header-card{padding:12px;margin-bottom:6px;}
.service-tag{font-size:13px;padding:7px 2px;}
.service-text{font-size:14px;}
.contact-info{font-size:15px;}
.qrcode-box{width:150px;height:150px;margin:12px auto 4px;}
.info-label{width:64px;white-space:nowrap;}
.modal-title{font-size:18px;}
.history-time{font-size:11px;}
.history-no{font-size:16px;}
.history-empty{font-size:13px;height:320px;}
.history-modal-mask{padding:10px;}
.nav-item{min-width:100px;}
.input-pill{font-size:18px;padding:0 6px 0 38px;}
.input-pill::placeholder{font-size:15px;}
.history-item{height:64px;padding:7px 18px;}
.history-list-wrap{max-height: calc(64px * 5);}
}
</style>
</head>
<body>
<div class="toast-layer" id="toastLayer"></div>
<div class="container">
    <div class="header-card">
        <div class="page-header">
            <h1>寄欧洲，国际货运</h1>
            <div class="tip-text">查件系统</div>
        </div>
        <div class="top-nav">
            <div class="nav-bar">
                <div class="nav-item" id="historyBtn">
                    <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 7V12L15 14" stroke="#0065b8" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="12" r="9" stroke="#0065b8" stroke-width="1.8"/>
                    </svg>历史记录
                </div>
                <div class="nav-item" id="contactJumpBtn">
                    <svg viewBox="0 0 24 24" fill="none">
                    <path d="M7 5H17V7H7V5ZM7 11H17V13H7V11ZM7 17H13V19H7V17Z" stroke="#0065b8" stroke-width="1.8"/>
                    </svg>联系我们
                </div>
            </div>
        </div>
        <input class="input-pill" id="orderInput" maxlength="95" placeholder="请输入单号，如：1Z0R6D896821448620">
        <div class="btn-row">
            <button class="btn-reset" id="resetBtn"><span>重置</span></button>
            <button class="btn-query" id="queryBtn"><span>查询</span></button>
        </div>
        <div class="result-box" id="resultBox"></div>
    </div>
    <div class="service-card" id="serviceCard">
        <div class="service-row">
            <span class="service-tag">⏱️ 时效稳定</span>
            <span class="service-tag">🛒 网购代收</span>
            <span class="service-tag">📷 拍照核对</span>
        </div>
        <p class="service-text"><strong>可寄：</strong>衣服裤子、被单被套、日用百货、零食干货、家乡土特产、药品化妆品、家用电器等。</p>
    </div>
    <div class="card-wrap" id="contactCard">
        <div class="contact-info">
            <div>📍 地址：青田县 水南 江南大道58号</div>
            <div>（爱丽斯特公交站 天桥旁）</div>
            <div>📞 电话：<a href="tel:13059665525">130 5966 5525</a></div>
        </div>
        <div class="qrcode-box"><img id="qrImg" src="qrcode.png" alt="微信二维码"></div>
        <div class="qr-desc">扫码添加微信，咨询发货、查件、运价</div>
    </div>
</div>
<div class="history-modal-mask" id="historyMask">
    <div class="history-modal">
        <div class="modal-header">
            <div class="modal-top-bar">
                <div class="modal-title">查询历史记录</div>
                <div class="modal-close" id="closeHistory">×</div>
            </div>
            <div class="history-clear-box">
                <span class="history-clear" id="clearAllHistory">清空历史记录</span>
            </div>
        </div>
        <div class="history-list-wrap" id="historyListWrap"></div>
    </div>
</div>
<div class="contact-modal-mask" id="contactMask">
    <div class="contact-modal">
        <div class="modal-header">
            <div class="modal-top-bar">
                <div class="modal-title">联系我们</div>
                <div class="modal-close" id="closeContact">×</div>
            </div>
        </div>
        <div class="contact-modal-body">
            <div class="contact-info">
                <div>📍 地址：青田县 水南 江南大道58号</div>
                <div>（爱丽斯特公交站 天桥旁）</div>
                <div>📞 电话：<a href="tel:13059665525">130 5966 5525</a></div>
            </div>
            <div class="qrcode-box"><img id="modalQrImg" src="qrcode.png" alt="微信二维码"></div>
            <div class="qr-desc">扫码添加微信，咨询发货、查件、运价</div>
        </div>
    </div>
</div>
<script>
const EL={
    orderInput:document.getElementById('orderInput'),
    queryBtn:document.getElementById('queryBtn'),
    resetBtn:document.getElementById('resetBtn'),
    resultBox:document.getElementById('resultBox'),
    toastLayer:document.getElementById('toastLayer'),
    contactJumpBtn:document.getElementById('contactJumpBtn'),
    historyMask:document.getElementById('historyMask'),
    historyListWrap:document.getElementById('historyListWrap'),
    historyBtn:document.getElementById('historyBtn'),
    closeHistory:document.getElementById('closeHistory'),
    clearAllHistory:document.getElementById('clearAllHistory'),
    serviceCard:document.getElementById('serviceCard'),
    contactMask:document.getElementById('contactMask'),
    closeContact:document.getElementById('closeContact'),
    modalQrImg:document.getElementById('modalQrImg'),
    qrImg:document.getElementById('qrImg')
};
const CONST={
    MAX_ROWS:10,
    MAX_TOAST_COUNT:5,
    TOAST_SHOW_TIME:1200,
    HISTORY_KEY:"track_query_history",
    MAX_HISTORY_COUNT:10,
    PROXY_URL:"https://xinjia3.onrender.com"
};
let toastQueue=[],hasRefreshedQr=false;
const showToast=msg=>{
    if(toastQueue.length>=CONST.MAX_TOAST_COUNT){
        const first=toastQueue.shift();
        first.remove();
    }
    const t=Object.assign(document.createElement('div'),{className:'toast-item',innerText:msg});
    EL.toastLayer.appendChild(t);
    toastQueue.push(t);
    t.classList.add('show');
    setTimeout(()=>{
        t.classList.remove('show');
        setTimeout(()=>{
            const idx=toastQueue.indexOf(t);
            if(idx>-1)toastQueue.splice(idx,1);
            t.remove();
        },250);
    },CONST.TOAST_SHOW_TIME);
};
const copyTransNo=async fullText=>{
    const pureNo = fullText.split(' ').pop();
    await navigator.clipboard.writeText(pureNo);
    showToast("转运单号复制成功");
};
window.fillAndSearch=num=>{
    EL.orderInput.value=num;
    EL.serviceCard.style.display='none';
    EL.resultBox.style.display='block';
    EL.queryBtn.click();
};
EL.contactJumpBtn.onclick=()=>{
    const base=EL.modalQrImg.src.split('?')[0];
    if(!hasRefreshedQr){
        EL.modalQrImg.src='';
        setTimeout(()=>EL.modalQrImg.src=`${base}?t=${Date.now()}`,0);
        hasRefreshedQr=true;
    }
    EL.contactMask.classList.add('show');
};
EL.closeContact.onclick=()=>EL.contactMask.classList.remove('show');
EL.contactMask.onclick=e=>e.target===EL.contactMask&&EL.contactMask.classList.remove('show');
EL.closeHistory.onclick=()=>EL.historyMask.classList.remove('show');
EL.historyMask.onclick=e=>e.target===EL.historyMask&&EL.historyMask.classList.remove('show');
EL.resetBtn.onclick=()=>{
    EL.orderInput.value='';
    EL.resultBox.style.display='none';
    EL.serviceCard.style.display='block';
    showToast('已清空输入单号');
};
// 仅请求后端统一接口，无任何第三方渠道直连
async function fetchTrackProxy(no){
    try{
        const res = await fetch(CONST.PROXY_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({trackNo: no}),
            signal:AbortSignal.timeout(7000)
        });
        if(!res.ok) return {code:-99,msg:"中转服务连接失败",data:[]};
        return await res.json();
    }catch(err){
        return {code:-99,msg:"中转服务请求超时",data:[]};
    }
}
// 标准化渲染函数，只读取后端统一输出字段，永久无需修改
function renderShipBlock(item,idx){
    const tid = `${idx}-${item.queryNo}`;
    const sortTrack = [...item.trackList].sort((a,b)=>new Date(b.time) - new Date(a.time));
    const preview = sortTrack.slice(0,2);
    const full = sortTrack.slice(2);
    let transHtml = '<span>无</span>';
    if(item.transNo){
        const parts = item.transNo.split(' ');
        if(parts.length > 1){
            const pre = parts.slice(0,-1).join(' ');
            const num = parts.pop();
            transHtml = `<span>${pre} </span><span class="text-blue" onclick="copyTransNo('${item.transNo}')">${num}</span>`;
        }else{
            transHtml = `<span class="text-blue" onclick="copyTransNo('${item.transNo}')">${item.transNo}</span>`;
        }
    }
    let destLine = `<span>${item.country || "暂无"}</span>`;
    if(item.parcelCount !== null) destLine += ` <span style="margin-left:12px;color:#333;">包裹数量：${item.parcelCount}件</span>`;
    const statusClass = item.status === "已签收" ? "tag-delivered" : "tag-transit";
    let html = `
    <div class="ship-card" data-index="${tid}">
        <div class="ship-head">
            <span class="status-tag ${statusClass}">${item.status}</span>
            <span class="tip-faint">如轨迹异常，尝试再次查询</span>
        </div>
        <div class="info-row">
            <span class="info-label">查询单号：</span>
            <span class="text-blue-static">${item.queryNo}</span>
        </div>
        <div class="info-row">
            <span class="info-label">转运单号：</span>
            ${transHtml}
        </div>
        <div class="info-row">
            <span class="info-label">目的地：</span>
            ${destLine}
        </div>
    `;
    html += `<div class="track-preview">`;
    preview.forEach(t=>{
        html += `<div class="timeline-item">
            <div class="track-time">${t.time}</div>
            <div class="track-desc">${t.info}${t.location ? ' — ' + t.location : ''}</div>
        </div>`;
    });
    html += `</div>`;
    if(full.length > 0){
        html += `<div class="track-full" id="track-${tid}">`;
        full.forEach(t=>{
            html += `<div class="timeline-item">
                <div class="track-time">${t.time}</div>
                <div class="track-desc">${t.info}${t.location ? ' — ' + t.location : ''}</div>
            </div>`;
        });
        html += `</div>
        <div class="toggle-track" data-target="${tid}">▼ 展开完整物流轨迹</div>`;
    }
    if(sortTrack.length === 0){
        html += `<div style="margin-top:8px;color:#888;font-size:14px;">暂未获取到物流轨迹</div>`;
    }
    html += `</div>`;
    return html;
}
document.addEventListener('click',e=>{
    const btn = e.target.closest('.toggle-track');
    if(!btn) return;
    const tid = btn.dataset.target;
    const dom = document.getElementById(`track-${tid}`);
    const open = dom.style.display === "block";
    dom.style.display = open ? "none" : "block";
    btn.innerText = open ? "▼ 展开完整物流轨迹" : "▲ 收起物流轨迹";
});
EL.queryBtn.onclick = async ()=>{
    const rawVal = EL.orderInput.value.trim();
    if(!rawVal){
        showToast("请输入单号!");
        return;
    }
    let filter = rawVal.replace(/[\u4e00-\u9fa5]/g,'');
    filter = filter.replace(/[^\da-zA-Z]+/g,'\n');
    const list = filter.split('\n').map(v=>v.trim().toUpperCase()).filter(v=>v);
    for(const s of list){
        if(!/^[A-Z0-9]+$/.test(s) || s.length <5 || s.length>18){
            showToast("单号长度需5-18位，请检查");
            return;
        }
    }
    const unique = [...new Set(list)];
    if(unique.length > CONST.MAX_ROWS){
        showToast(`单次最多${CONST.MAX_ROWS}个单号`);
        return;
    }
    EL.serviceCard.style.display = "none";
    EL.resultBox.style.display = "block";
    EL.resultBox.innerHTML = `<div class="loading-tip">🔄 正在查询...</div>`;
    let renderHtml = "";
    let failList = [];
    try{
        for(let i=0;i<unique.length;i++){
            const no = unique[i];
            EL.resultBox.innerHTML = `<div class="loading-tip">🔄 第${i+1}/${unique.length}个：${no}</div>`;
            const res = await fetchTrackProxy(no);
            if(res.code === 0 && Array.isArray(res.data) && res.data.length > 0){
                res.data.forEach((item,j)=>{
                    renderHtml += renderShipBlock(item, i*10 + j);
                });
                addHistoryRecord(no);
            }else{
                failList.push({no, msg:res.msg});
            }
        }
        let title = `<h3>查询结果（共${unique.length}个单号）</h3>`;
        failList.forEach(f=>{
            title += `<div class="error-msg-box">
                <div class="error-msg-title">单号 ${f.no}</div>
                <div class="error-msg-content">${f.msg}</div>
            </div>`;
        });
        EL.resultBox.innerHTML = title + renderHtml;
    }catch(err){
        EL.resultBox.innerHTML = `<div style="padding:20px;color:red;">查询异常：${err.message}</div>`;
    }
};
const getHistory = ()=>JSON.parse(localStorage.getItem(CONST.HISTORY_KEY)||'[]');
const saveHistory = arr=>{
    if(arr.length > CONST.MAX_HISTORY_COUNT) arr.length = CONST.MAX_HISTORY_COUNT;
    localStorage.setItem(CONST.HISTORY_KEY,JSON.stringify(arr));
};
const getNowTime = ()=>{
    const d = new Date();
    return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};
const addHistoryRecord = no=>{
    const arr = getHistory();
    const idx = arr.findIndex(x=>x.no === no);
    if(idx > -1) arr.splice(idx,1);
    arr.unshift({no, time:getNowTime()});
    saveHistory(arr);
};
const renderHistory = ()=>{
    const arr = getHistory();
    if(!arr.length) return EL.historyListWrap.innerHTML = `<div class="history-empty">暂无历史记录</div>`;
    EL.historyListWrap.innerHTML = arr.map(item=>`
        <div class="history-item" data-no="${item.no}">
            <div class="history-time">最近查询：${item.time}</div>
            <div class="history-no">${item.no}</div>
        </div>
    `).join('');
    document.querySelectorAll('.history-item').forEach(row=>{
        row.onclick = ()=>{
            EL.orderInput.value = row.dataset.no;
            EL.historyMask.classList.remove('show');
            EL.resultBox.style.display = "block";
            EL.queryBtn.click();
        };
    });
};
EL.historyBtn.onclick = ()=>{
    const arr = getHistory();
    if(!arr.length) return showToast("暂无历史记录");
    renderHistory();
    EL.historyMask.classList.add('show');
};
EL.clearAllHistory.onclick = ()=>{
    localStorage.removeItem(CONST.HISTORY_KEY);
    renderHistory();
    EL.historyMask.classList.remove('show');
    showToast("已清空记录");
};
EL.orderInput.addEventListener("keydown",e=>{
    if(e.key === "Enter") EL.queryBtn.click();
});
</script>
</body>
</html>
